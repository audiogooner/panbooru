<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panbooru — UI prototype</title><link rel="stylesheet" href="style.css"></head>
<body>
<svg class="defs" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
<symbol id="book-image" viewBox="0 0 24 24"><path d="M5 3h14v18H6a3 3 0 0 1 0-6h13M5 3v12"/><path d="m8 12 3-4 2 2 2-3 2 5"/><circle cx="9" cy="6" r=".5"/></symbol>
<symbol id="heart" viewBox="0 0 24 24"><path d="M20.4 4.6a5.5 5.5 0 0 0-7.8 0L12 5.2l-.6-.6a5.5 5.5 0 0 0-7.8 7.8L12 21l8.4-8.6a5.5 5.5 0 0 0 0-7.8Z"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="sort" viewBox="0 0 24 24"><path d="M4 5h16M4 12h11M4 19h6M19 11v9m-3-3 3 3 3-3"/></symbol>
<symbol id="up" viewBox="0 0 24 24"><path d="M4 5h6M4 12h11M4 19h16m-1-8V2m-3 3 3-3 3 3"/></symbol>
<symbol id="shuffle" viewBox="0 0 24 24"><path d="m3 5 4 0 10 14h4m-4-4 4 4-4 3M3 19h4L17 5h4m-4-3 4 3-4 4"/></symbol>
<symbol id="star" viewBox="0 0 24 24"><path d="m12 3 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z"/></symbol>
<symbol id="rating" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z"/><path d="m8 12 3 3 5-6"/></symbol>
<symbol id="image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m3 17 6-6 4 4 3-3 5 5"/><circle cx="16" cy="8" r="1"/></symbol>
<symbol id="film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4m-4 6h4m10-6h4m-4 6h4"/></symbol>
<symbol id="play" viewBox="0 0 24 24"><path d="m8 4 12 8-12 8Z"/></symbol>
<symbol id="animate" viewBox="0 0 24 24"><rect x="7" y="3" width="14" height="14" rx="2"/><path d="M3 7v12a2 2 0 0 0 2 2h12m-6-14 6 3-6 3Z"/></symbol>
<symbol id="settings" viewBox="0 0 24 24"><path d="m9 3-1 3-3 1 1 4-2 2 2 3 3-1 3 3 3-3 3 1 2-3-2-2 1-4-3-1-1-3Z"/><circle cx="12" cy="11" r="3"/></symbol>
<symbol id="sliders" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><path d="M9 3v6m6 0v6m-7 0v6"/></symbol>
<symbol id="external" viewBox="0 0 24 24"><path d="M14 3h7v7m0-7L10 14M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></symbol>
<symbol id="download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></symbol>
<symbol id="full" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m8 0h5v-5"/></symbol>
<symbol id="panel" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M15 3v18m3-12v6"/></symbol>
<symbol id="left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
<symbol id="right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="pin" viewBox="0 0 24 24"><path d="m9 3 10 10-4 1-4 5-3-3-5 5m2-14 4-4m-4 4 6 6m0-10 8 8"/></symbol>
<symbol id="saved" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4Z"/></symbol>
<symbol id="artist" viewBox="0 0 24 24"><path d="m15 3 6 6-10 10-6 1 1-6Z"/><path d="m13 5 6 6M5 20l-2 1 1-4"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></symbol>
</defs></svg>
<div id="app">
<aside id="sidebar" aria-label="Main navigation">
<div class="brand"><span class="brand-placeholder" title="Logo placeholder — artwork undecided"></span><strong>Panbooru</strong><span class="demo-dot" title="Local sample-data prototype"></span></div>
<button class="new-search" id="new-search"><svg><use href="#plus"/></svg>New search</button>
<span id="view-count" hidden></span>
<div id="views" class="view-list"></div>
<div id="album-divider" class="divider" role="separator" tabindex="0" aria-label="Resize album section" aria-orientation="horizontal"></div>
<div class="section-heading">ALBUMS</div><div id="album-nav" class="album-nav"></div>
<nav id="destinations"></nav><div id="taskbar" hidden><button id="task-trigger" aria-label="Background tasks"><span></span></button></div>
<div id="side-resize" role="separator" tabindex="0" aria-label="Resize sidebar" aria-orientation="vertical"></div>
</aside>
<main id="main">
<div id="toolbar" class="toolbar"></div><div id="scroll" tabindex="-1"><div id="page-heading"></div><div id="content"></div><div class="footer-note">Local UI study · sample artwork · no Gelbooru connection</div></div>
</main>
</div>
<section id="viewer" hidden aria-label="Media viewer">
<div id="viewer-backdrop" aria-hidden="true"></div>
<div id="media-area"><img id="full-image" draggable="false" alt=""><div class="edge-zone edge-left"></div><div class="edge-zone edge-right"></div><button id="previous" class="glass edge-button" title="Previous · ← / A"><svg><use href="#left"/></svg></button><button id="next" class="glass edge-button" title="Next · → / D"><svg><use href="#right"/></svg></button></div>
<button id="back" class="glass viewer-back" title="Back to gallery · Escape"><svg><use href="#left"/></svg></button>
<div id="viewer-bar" class="glass viewer-bar"></div>
<div id="right-panel" hidden><div id="right-resize" role="separator" tabindex="0" aria-label="Resize details panel" aria-orientation="vertical"></div><div id="right-scroll"></div></div>
<div id="zoom-readout"></div>
</section>
<div id="popup" class="popup" hidden></div><div id="context-menu" class="popup context-menu" hidden role="menu"></div><div id="message" role="status" hidden></div>
<dialog id="dialog"><form method="dialog" id="dialog-form"></form></dialog>
<script src="sample-downloads.js"></script><script src="app.js"></script>
</body></html>
