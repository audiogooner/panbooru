services:
  panbooru:
    build: .
    user: "1001:1001"
    environment:
      HOST: 127.0.0.1
      PORT: "3000"
      PANBOORU_DATA_DIR: /data
      PANBOORU_SECRET_PATH: /run/panbooru-secrets/master.key
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - panbooru-data:/data
      - panbooru-secrets:/run/panbooru-secrets

volumes:
  panbooru-data:
  panbooru-secrets:
